name: Build CVE Payload AYA1
on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build-payload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_NAME: pa3q-S9380ZHU1AYA1
      API: 35
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖工具
        run: sudo apt update && sudo apt install -y make zip

      - name: 自动安装 NDK r29
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: 校验NDK和环境
        run: |
          echo "ANDROID_NDK_HOME = $ANDROID_NDK_HOME"
          echo "API = ${{ env.API }}"
          
          # NDK r29 编译器不带API数字后缀，修复路径
          CLANG_PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang"
          echo "期望的编译器路径: $CLANG_PATH"
          
          echo "可用的aarch64编译器："
          ls ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-* 2>/dev/null || echo "未找到aarch64编译器"
          
          if [ ! -x "$CLANG_PATH" ]; then
            echo "错误：编译器不存在！"
            find ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/ -name "*aarch64*clang*" -type f 2>/dev/null || echo "未找到任何aarch64编译器"
            exit 1
          fi
          
          echo "编译器验证成功！"
          $CLANG_PATH --version

      - name: 调试Makefile变量
        run: |
          export ANDROID_NDK_HOME
          export CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang"
          # 修复1：make info → make debug；修复2：PROJECT → TARGET
          make debug API=${{ env.API }} TARGET=${{ env.TARGET_NAME }}

      - name: 编译漏洞程序
        run: |
          export ANDROID_NDK_HOME
          export CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang"
          echo "使用编译器: $CLANG"
          # PROJECT 改为 TARGET
          make API=${{ env.API }} TARGET=${{ env.TARGET_NAME }} all

      - name: 打包编译产物ZIP
        run: zip -r payload-build.zip build/

      - name: 上传制品压缩包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_NAME }}-build-zip
          path: payload-build.zip
          retention-days: 30
